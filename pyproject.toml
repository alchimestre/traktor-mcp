[project]
name = "traktor-mcp"
version = "0.1.0"
description = "MCP tools for a Traktor collection, over the traktor-nml library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# The reconciliation lives in `traktor-nml`; this package is the MCP surface over it. `mcp` is the official
# SDK, whose v2 names this server is written against (v1 called the class `FastMCP`), so the major is pinned.
dependencies = [
    "mcp>=2.3,<3",
    "traktor-nml",
]

[project.scripts]
traktor-mcp = "traktor_mcp.server:main"

[project.urls]
Repository = "https://github.com/alchimestre/traktor-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traktor_mcp"]

# In development the two checkouts sit side by side. Once traktor-nml is published this can name its
# repository instead — `traktor-nml = { git = "https://github.com/alchimestre/traktor-nml" }` — and the
# package installs on its own.
[tool.uv.sources]
traktor-nml = { path = "../traktor-nml", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
